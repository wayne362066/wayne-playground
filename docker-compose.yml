name: wayne-playground

x-backend: &backend
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  working_dir: /var/www/html
  env_file:
    - .env
  volumes:
    - ./backend:/var/www/html
  networks:
    - playground
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - playground
    depends_on:
      - php
    restart: unless-stopped

  php:
    <<: *backend

  reverb:
    <<: *backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8081:8080"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-playground}
      POSTGRES_USER: ${DB_USERNAME:-playground}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-playground}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - playground
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-playground} -d ${DB_DATABASE:-playground}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - playground
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  node:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-wayne-playground-local}
      VITE_REVERB_HOST: ${VITE_REVERB_PUBLIC_HOST:-localhost}
      VITE_REVERB_PORT: ${VITE_REVERB_PUBLIC_PORT:-8081}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - playground
    restart: unless-stopped

  queue-worker:
    <<: *backend
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90

  scheduler:
    <<: *backend
    command: php artisan schedule:work

networks:
  playground:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
